<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Météo Saint-Denis – La Réunion</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ocean:   #0d5f8a;
      --sky:     #4ab3d8;
      --foam:    #e8f6fb;
      --coral:   #e8613a;
      --sand:    #f5f0e8;
      --night:   #0a2233;
      --text:    #1a3a4a;
      --muted:   #6b8fa3;
      --radius:  16px;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--sand);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(10,34,51,.12);
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--ocean) 0%, var(--sky) 100%);
      padding: 28px 24px 24px;
      color: white;
      position: relative;
    }

    .location {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .75;
      margin-bottom: 4px;
    }

    .city { font-size: 22px; font-weight: 600; }
    .island { font-size: 13px; opacity: .7; margin-top: 2px; }

    .main-temp-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 20px;
    }

    .temp-big {
      font-size: 64px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -2px;
    }

    .temp-unit { font-size: 28px; font-weight: 400; vertical-align: super; margin-left: 2px; }

    .condition-icon {
      font-size: 56px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.2));
    }

    .condition-text {
      font-size: 13px;
      opacity: .85;
      margin-top: 8px;
    }

    .update-time {
      font-size: 10px;
      opacity: .55;
      margin-top: 4px;
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--foam);
      border-bottom: 1px solid #d6eef7;
    }

    .stat {
      padding: 14px 8px;
      text-align: center;
      border-right: 1px solid #d6eef7;
    }
    .stat:last-child { border-right: none; }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--ocean);
    }

    /* ── Forecast ── */
    .forecast { padding: 16px 24px 20px; }

    .forecast-title {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .days { display: flex; gap: 8px; }

    .day {
      flex: 1;
      background: var(--sand);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }

    .day-name {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .day-icon { font-size: 22px; margin-bottom: 5px; }

    .day-temp {
      font-size: 13px;
      font-weight: 600;
      color: var(--ocean);
    }

    .day-rain {
      font-size: 9px;
      color: var(--sky);
      margin-top: 3px;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 24px 12px;
      text-align: center;
      font-size: 9px;
      color: var(--muted);
      border-top: 1px solid #eee;
    }

    .loading-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--ocean) 0%, var(--sky) 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 14px; opacity: .9;
      border-radius: var(--radius);
    }

    .error-msg {
      padding: 24px;
      text-align: center;
      color: var(--coral);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="card">
  <div id="widget">
    <div class="loading-overlay">Chargement de la météo…</div>
  </div>
</div>

<script>
const WMO = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌧️',
  61:'🌧️', 63:'🌧️', 65:'🌧️',
  80:'🌦️', 81:'🌧️', 82:'⛈️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};

const WMO_TXT = {
  0:'Ciel dégagé', 1:'Généralement ensoleillé', 2:'Partiellement nuageux', 3:'Couvert',
  45:'Brouillard', 48:'Brouillard givrant',
  51:'Bruine légère', 53:'Bruine modérée', 55:'Bruine dense',
  61:'Pluie légère', 63:'Pluie modérée', 65:'Pluie forte',
  80:'Averses légères', 81:'Averses', 82:'Averses violentes',
  95:'Orage', 96:'Orage avec grêle', 99:'Orage fort'
};

const DAYS_FR = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

async function fetchWeather() {
  const url = 'https://api.open-meteo.com/v1/forecast' +
    '?latitude=-20.8789&longitude=55.4481' +
    '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code' +
    '&daily=weather_code,temperature_2m_max,precipitation_probability_max' +
    '&timezone=Indian%2FReunion&forecast_days=5&wind_speed_unit=kmh';

  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function render(d) {
  const c = d.current;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

  const icon = WMO[c.weather_code] ?? '🌡️';
  const cond = WMO_TXT[c.weather_code] ?? 'Données indisponibles';
  const temp = Math.round(c.temperature_2m);
  const hum  = c.relative_humidity_2m;
  const wind = Math.round(c.wind_speed_10m);

  const forecastHTML = d.daily.time.slice(0,5).map((dateStr, i) => {
    const date = new Date(dateStr + 'T00:00:00');
    const dayName = i === 0 ? 'Auj.' : DAYS_FR[date.getDay()];
    const fi = WMO[d.daily.weather_code[i]] ?? '🌡️';
    const ft = Math.round(d.daily.temperature_2m_max[i]);
    const fp = d.daily.precipitation_probability_max[i] ?? 0;
    return `
      <div class="day">
        <div class="day-name">${dayName}</div>
        <div class="day-icon">${fi}</div>
        <div class="day-temp">${ft}°</div>
        <div class="day-rain">${fp}%</div>
      </div>`;
  }).join('');

  document.getElementById('widget').innerHTML = `
    <div class="header">
      <div class="location">📍 Météo en direct</div>
      <div class="city">Saint-Denis</div>
      <div class="island">La Réunion · Océan Indien</div>
      <div class="main-temp-row">
        <div>
          <span class="temp-big">${temp}<span class="temp-unit">°C</span></span>
          <div class="condition-text">${cond}</div>
          <div class="update-time">Mis à jour à ${timeStr}</div>
        </div>
        <div class="condition-icon">${icon}</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Humidité</div>
        <div class="stat-value">${hum}%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Vent</div>
        <div class="stat-value">${wind} km/h</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pluie J+0</div>
        <div class="stat-value">${d.daily.precipitation_probability_max[0] ?? 0}%</div>
      </div>
    </div>
    <div class="forecast">
      <div class="forecast-title">Prévisions 5 jours</div>
      <div class="days">${forecastHTML}</div>
    </div>
    <div class="footer">Données : Open-Meteo · Actualisation automatique toutes les 30 min</div>
  `;
}

(async () => {
  try {
    const data = await fetchWeather();
    render(data);
    // Auto-refresh toutes les 30 minutes
    setInterval(async () => {
      try { render(await fetchWeather()); } catch(e) {}
    }, 30 * 60 * 1000);
  } catch(e) {
    document.getElementById('widget').innerHTML =
      `<div class="error-msg">⚠️ Impossible de charger la météo.<br><small>${e.message}</small></div>`;
  }
})();
</script>
</body>
</html>
