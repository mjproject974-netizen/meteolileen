<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Météo de La Maison en Brique – La Montagne</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lileen-sky:    #7ba7c4;
      --lileen-deep:   #3d6b8a;
      --lileen-gold:   #c8a84b;
      --lileen-amber:  #e8c97a;
      --lileen-stone:  #8b7355;
      --lileen-moss:   #6b8c5a;
      --lileen-cream:  #f5f0e2;
      --lileen-parch:  #ede5cc;
      --lileen-rust:   #9b6b3a;
      --lileen-dark:   #2a1f14;
      --lileen-sepia:  #4a3728;
      --lileen-crystal:#a8d4e8;
      --radius: 4px;
    }

    @keyframes floatCloud {
      0%   { transform: translateX(0px) translateY(0px); }
      33%  { transform: translateX(8px) translateY(-4px); }
      66%  { transform: translateX(-4px) translateY(-7px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes floatCloud2 {
      0%   { transform: translateX(0px) translateY(0px); }
      50%  { transform: translateX(-10px) translateY(-5px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes gearSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes gearSpinReverse {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @keyframes crystalPulse {
      0%, 100% { opacity: .85; filter: drop-shadow(0 0 6px var(--crystal-glow, #a8d4e8aa)); }
      50%       { opacity: 1;   filter: drop-shadow(0 0 14px var(--crystal-glow-hi, #a8d4e8ff)); }
    }
    /* Teinte du halo du cristal selon le moment */
    body.theme-aube        { --crystal-glow: #f0b070aa; --crystal-glow-hi: #f8d090ff; }
    body.theme-crepuscule  { --crystal-glow: #e07040aa; --crystal-glow-hi: #f09050ff; }
    body.theme-nuit        { --crystal-glow: #6080c0aa; --crystal-glow-hi: #80a0e0ff; }
    @keyframes crystalFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25%       { transform: translateY(-6px) rotate(2deg); }
      75%       { transform: translateY(-3px) rotate(-1deg); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: .6; }
      50%       { opacity: 1; }
    }
    @keyframes birdFly {
      0%   { transform: translateX(-60px) translateY(0px); opacity: 0; }
      10%  { opacity: .7; }
      45%  { transform: translateX(160px) translateY(-18px); }
      55%  { transform: translateX(220px) translateY(-12px); }
      90%  { opacity: .5; }
      100% { transform: translateX(420px) translateY(-22px); opacity: 0; }
    }
    @keyframes runeGlow {
      0%, 100% { opacity: .25; }
      50%       { opacity: .55; }
    }
    /* Indicateur de fetch en cours : l'orbe dorée dans le footer pulse */
    @keyframes fetchPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .25; }
    }

    body {
      font-family: 'Crimson Text', Georgia, serif;
      /* JOUR — azur tropical : cobalt profond au zénith → bleu layette vers l'horizon */
      background: linear-gradient(175deg,
        #0b5ea0 0%,
        #1a82c8 22%,
        #40a8d8 46%,
        #7dc4e2 68%,
        #b8dcea 85%,
        #d8edf5 100%);
      color: var(--lileen-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: background 1.6s ease;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      /* JOUR — voiles de cirrus blancs */
      background:
        radial-gradient(ellipse 220px 80px at 15% 28%, rgba(255,255,255,.38) 0%, transparent 70%),
        radial-gradient(ellipse 300px 100px at 78% 18%, rgba(255,255,255,.28) 0%, transparent 70%),
        radial-gradient(ellipse 160px 55px at 50% 72%, rgba(255,255,255,.18) 0%, transparent 70%);
      pointer-events: none;
      animation: floatCloud 18s ease-in-out infinite;
      transition: opacity 1.6s ease;
    }
    /* AUBE — lueur rose-dorée sur les nuages */
    body.theme-aube::before {
      background:
        radial-gradient(ellipse 260px 90px at 20% 60%, rgba(240,160,80,.35) 0%, transparent 70%),
        radial-gradient(ellipse 200px 70px at 70% 75%, rgba(220,100,100,.28) 0%, transparent 70%),
        radial-gradient(ellipse 180px 65px at 45% 40%, rgba(180,100,160,.22) 0%, transparent 70%);
    }
    /* CRÉPUSCULE — embrasement chaud à l'horizon */
    body.theme-crepuscule::before {
      background:
        radial-gradient(ellipse 300px 100px at 50% 85%, rgba(240,100,20,.45) 0%, transparent 65%),
        radial-gradient(ellipse 200px 70px at 80% 70%, rgba(200,40,60,.30) 0%, transparent 65%),
        radial-gradient(ellipse 160px 60px at 15% 65%, rgba(160,20,80,.22) 0%, transparent 65%);
    }
    /* NUIT — quasi-absent, juste une très légère lueur bleue au zénith */
    body.theme-nuit::before {
      background:
        radial-gradient(ellipse 280px 120px at 50% 10%, rgba(30,60,120,.18) 0%, transparent 70%);
    }

    .card {
      background: var(--lileen-cream);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px var(--lileen-stone),
        0 0 0 3px var(--lileen-parch),
        0 0 0 4px var(--lileen-gold),
        0 8px 32px rgba(42,31,20,.35);
      position: relative;
      animation: fadeSlideUp .8s ease both;
      transition: box-shadow 1.6s ease;
    }
    /* Halo de la carte : chaud à l'aube/crépuscule, bleu nuit la nuit */
    body.theme-aube .card {
      box-shadow:
        0 0 0 1px #7a4838,
        0 0 0 3px #ede5cc,
        0 0 0 4px #d4884a,
        0 8px 40px rgba(180,80,20,.45);
    }
    body.theme-crepuscule .card {
      box-shadow:
        0 0 0 1px #6a2010,
        0 0 0 3px #ede5cc,
        0 0 0 4px #c04010,
        0 8px 40px rgba(160,30,10,.55);
    }
    body.theme-nuit .card {
      box-shadow:
        0 0 0 1px #101828,
        0 0 0 3px #1a2238,
        0 0 0 4px #8a9ab8,
        0 8px 40px rgba(4,8,24,.8);
    }

    .card::before, .card::after {
      content: '✦';
      position: absolute;
      font-size: 14px;
      color: var(--lileen-gold);
      z-index: 10;
      animation: shimmer 3s ease-in-out infinite;
    }
    .card::before { top: 6px; left: 8px; }
    .card::after  { top: 6px; right: 8px; }

    /* ── Header ── */
    .header {
      /* JOUR — bleu Océan Indien profond */
      background:
        linear-gradient(180deg, #0d5a88 0%, #1878aa 38%, #146888 70%, #0e5070 100%);
      padding: 28px 24px 20px;
      color: var(--lileen-cream);
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid var(--lileen-gold);
      transition: background 1.6s ease;
    }

    .header::before {
      content: '⊕ ⊗ ⊕ ⊗ ⊕ ⊗ ⊕ ⊗ ⊕ ⊗ ⊕ ⊗ ⊕';
      position: absolute;
      bottom: 6px; left: 0; right: 0;
      text-align: center;
      font-size: 8px;
      letter-spacing: 4px;
      color: var(--lileen-gold);
      opacity: .4;
      animation: runeGlow 4s ease-in-out infinite;
    }

    /* ── AUBE ──
       Zénith : indigo-violet profond
       Mi-ciel : rose-mauve, corail
       Horizon : ambre chaud, or pâle                      */
    body.theme-aube {
      background: linear-gradient(175deg,
        #1a1450 0%,
        #502068 18%,
        #a84860 36%,
        #d87050 55%,
        #f0a840 74%,
        #f8cc70 88%,
        #fde8a8 100%);
    }
    body.theme-aube .header {
      background: linear-gradient(180deg,
        #2a0e42 0%,
        #7a2850 30%,
        #c86040 62%,
        #e49840 100%);
    }

    /* ── CRÉPUSCULE ──
       Zénith : violet quasi-noir
       Mi-ciel : pourpre, cramoisi
       Horizon : orange brûlé, or ardent                   */
    body.theme-crepuscule {
      background: linear-gradient(175deg,
        #06020e 0%,
        #280838 18%,
        #720c30 34%,
        #b82010 52%,
        #d84c08 68%,
        #f08018 82%,
        #f8b030 100%);
    }
    body.theme-crepuscule .header {
      background: linear-gradient(180deg,
        #080210 0%,
        #400820 30%,
        #981408 62%,
        #c83808 100%);
    }

    /* ── NUIT ──
       Zénith : noir quasi-absolu
       Mi-ciel : bleu de minuit très sombre
       Horizon : légère teinte indigo (réflexion des lumières) */
    body.theme-nuit {
      background: linear-gradient(175deg,
        #010106 0%,
        #02030c 25%,
        #030818 50%,
        #060e24 72%,
        #0a1430 88%,
        #101c3a 100%);
    }
    body.theme-nuit .header {
      background: linear-gradient(180deg,
        #010208 0%,
        #030610 45%,
        #020408 100%);
    }

    .stars-wrap {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s ease;
    }
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.4px 1.4px at 12% 20%, #fff, transparent),
        radial-gradient(1px 1px at 28% 12%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 45% 28%, #fff, transparent),
        radial-gradient(1px 1px at 62% 10%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 78% 22%, #fff, transparent),
        radial-gradient(1px 1px at 90% 35%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 8% 42%, #fff, transparent),
        radial-gradient(1px 1px at 36% 46%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 55% 40%, #fff, transparent),
        radial-gradient(1px 1px at 95% 14%, #fff, transparent);
      animation: shimmer 4s ease-in-out infinite;
    }
    body.theme-nuit       .stars-wrap { opacity: 1; }
    body.theme-crepuscule .stars-wrap { opacity: .35; }
    body.theme-aube        .stars-wrap { opacity: .15; }

    .clouds-svg {
      position: absolute;
      top: 0; left: 0; right: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .cloud-1 { animation: floatCloud  14s ease-in-out infinite; }
    .cloud-2 { animation: floatCloud2 20s ease-in-out infinite; }
    .cloud-3 { animation: floatCloud  17s ease-in-out infinite reverse; }

    .bird-wrap {
      position: absolute;
      top: 18px; left: 0;
      width: 100%; height: 20px;
      pointer-events: none;
      overflow: hidden;
    }
    .bird {
      position: absolute;
      top: 0; left: 0;
      font-size: 13px;
      animation: birdFly 12s ease-in-out infinite;
      animation-delay: 3s;
      opacity: 0;
    }

    .location {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--lileen-amber);
      margin-bottom: 4px;
      position: relative;
    }

    .city {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--lileen-cream);
      position: relative;
      text-shadow: 0 1px 8px rgba(0,0,0,.4);
    }
    .island {
      font-family: 'Crimson Text', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--lileen-crystal);
      margin-top: 2px;
      position: relative;
    }

    .main-temp-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-top: 18px;
      position: relative;
    }

    .temp-big {
      font-family: 'Cinzel', serif;
      font-size: 62px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--lileen-cream);
      text-shadow: 0 0 20px rgba(168,212,232,.5);
    }
    .temp-unit {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 400;
      vertical-align: super;
      margin-left: 2px;
      color: var(--lileen-amber);
    }

    .condition-text {
      font-style: italic;
      font-size: 14px;
      color: var(--lileen-crystal);
      margin-top: 6px;
    }
    .update-time {
      font-size: 10px;
      color: rgba(245,240,226,.45);
      margin-top: 3px;
      letter-spacing: .06em;
    }

    .crystal-icon {
      width: 72px;
      height: 72px;
      animation: crystalFloat 5s ease-in-out infinite, crystalPulse 3s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(168,212,232,.6));
      flex-shrink: 0;
    }

    .gear-wrap {
      position: absolute;
      bottom: 14px; right: 16px;
      display: flex; gap: 0px;
      align-items: center;
      opacity: .35;
    }
    .gear-big {
      width: 28px; height: 28px;
      transform-origin: center;
      animation: gearSpin 8s linear infinite;
    }
    .gear-small {
      width: 18px; height: 18px;
      transform-origin: center;
      animation: gearSpinReverse 4.4s linear infinite;
      margin-left: -4px;
      margin-top: 5px;
    }
    .gear-tiny {
      width: 12px; height: 12px;
      transform-origin: center;
      animation: gearSpin 2.9s linear infinite;
      margin-left: -3px;
      margin-bottom: 2px;
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--lileen-parch);
      border-bottom: 1px solid var(--lileen-stone);
      position: relative;
    }

    .stats::before {
      content: '— ✦ —';
      position: absolute;
      top: -10px; left: 50%; transform: translateX(-50%);
      font-size: 10px;
      color: var(--lileen-gold);
      background: var(--lileen-parch);
      padding: 0 6px;
      letter-spacing: 2px;
    }

    .stat {
      padding: 14px 8px;
      text-align: center;
      border-right: 1px solid rgba(139,115,85,.3);
    }
    .stat:last-child { border-right: none; }

    .stat-label {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--lileen-stone);
      margin-bottom: 5px;
    }

    .stat-value {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--lileen-rust);
    }

    .stat-icon {
      font-size: 15px;
      margin-bottom: 3px;
      display: block;
    }

    /* ── Forecast ── */
    .forecast {
      padding: 16px 24px 20px;
      background: var(--lileen-cream);
      position: relative;
    }

    .forecast::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 22px,
        rgba(139,115,85,.06) 22px,
        rgba(139,115,85,.06) 23px
      );
      pointer-events: none;
    }

    .forecast-title {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--lileen-stone);
      margin-bottom: 12px;
      text-align: center;
      position: relative;
    }
    .forecast-title::before,
    .forecast-title::after {
      content: '──';
      margin: 0 8px;
      opacity: .5;
    }

    .days {
      display: flex;
      gap: 6px;
      position: relative;
    }

    .day {
      flex: 1;
      background: var(--lileen-parch);
      border: 1px solid rgba(139,115,85,.4);
      border-radius: 3px;
      padding: 10px 4px 8px;
      text-align: center;
      transition: transform .2s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .day::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--lileen-gold), var(--lileen-amber), var(--lileen-gold));
      opacity: .5;
    }
    .day:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42,31,20,.15);
    }

    .day-name {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--lileen-stone);
      margin-bottom: 5px;
    }
    .day-icon { font-size: 20px; margin-bottom: 4px; }
    .day-temp {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--lileen-rust);
    }
    .day-rain {
      font-size: 10px;
      color: var(--lileen-sky);
      margin-top: 2px;
      font-style: italic;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 24px 12px;
      text-align: center;
      font-style: italic;
      font-size: 11px;
      color: var(--lileen-stone);
      border-top: 1px solid rgba(139,115,85,.3);
      background: var(--lileen-parch);
      letter-spacing: .04em;
    }

    /* Indicateur de fetch : l'orbe ✦ du footer pulse en doré pendant le chargement */
    .footer-orb {
      display: inline-block;
      transition: color .4s;
    }
    .footer-orb.fetching {
      color: var(--lileen-gold);
      animation: fetchPulse .8s ease-in-out infinite;
    }
    .footer-orb.error {
      color: #c06040;
    }

    /* ── Loading / Error ── */
    .loading-overlay {
      background: linear-gradient(160deg, #4a7a9b 0%, #3d6b8a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      color: var(--lileen-cream);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: .1em;
      gap: 16px;
    }
    .loading-crystal {
      width: 48px; height: 48px;
      animation: crystalFloat 3s ease-in-out infinite, crystalPulse 2s ease-in-out infinite;
    }

    .error-msg {
      padding: 24px;
      text-align: center;
      font-style: italic;
      color: var(--lileen-rust);
      font-size: 13px;
    }

    /* ── Calcifer ── */
    @keyframes calciferFlicker {
      0%,100% { transform: scaleY(1)    scaleX(1);    }
      15%     { transform: scaleY(1.09) scaleX(0.93); }
      35%     { transform: scaleY(0.93) scaleX(1.06); }
      60%     { transform: scaleY(1.06) scaleX(0.96); }
      80%     { transform: scaleY(0.95) scaleX(1.04); }
    }
    @keyframes calciferGlow {
      0%,100% { filter: drop-shadow(0 0 4px rgba(40,100,240,0.55)); }
      50%     { filter: drop-shadow(0 0 14px rgba(80,160,255,0.95)); }
    }
    @keyframes eyeBlink {
      0%,86%,100% { transform: scaleY(1); }
      93%         { transform: scaleY(0.08); }
    }

    /* ── Lucioles (nuit) ── */
    @keyframes fireflyDrift {
      0%    { opacity: 0;   transform: translate(0,0); }
      20%   { opacity: 0.9; }
      55%   { opacity: 0.5; transform: translate(var(--fx,10px),var(--fy,-14px)); }
      80%   { opacity: 0.7; }
      100%  { opacity: 0;   transform: translate(0,0); }
    }
    @keyframes fireflyGlow {
      0%,100% { box-shadow: 0 0 2px 1px rgba(180,255,120,0.55); }
      50%     { box-shadow: 0 0 6px 3px rgba(210,255,150,0.92); }
    }

    /* ── Calcifer ── */
    .calcifer-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
      animation: calciferGlow 2.2s ease-in-out infinite;
    }
    .calcifer-svg {
      transform-origin: 50% 90%;
      animation: calciferFlicker 1.9s ease-in-out infinite;
      overflow: visible;
    }
    .calcifer-eye {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: eyeBlink 5s ease-in-out infinite;
    }

    /* ── Lucioles ── */
    .firefly {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(200,255,140,0.85);
      display: none;
      animation:
        fireflyDrift var(--fd,5s)  ease-in-out infinite var(--fdelay,0s),
        fireflyGlow  1.6s ease-in-out infinite var(--fdelay,0s);
    }
    body.theme-nuit .firefly { display: block; }

    /* La section forecast devient le conteneur relatif des lucioles */
    .forecast { position: relative; }
  </style>
</head>
<body>

<div class="card">
  <div id="widget">
    <div class="loading-overlay">
      <svg class="loading-crystal" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="24,2 38,14 38,34 24,46 10,34 10,14" fill="#a8d4e8" fill-opacity=".7" stroke="#c8e8f4" stroke-width="1"/>
        <polygon points="24,8 34,17 34,31 24,40 14,31 14,17" fill="#c8e8f4" fill-opacity=".5" stroke="#e0f2fa" stroke-width=".5"/>
        <line x1="24" y1="2" x2="24" y2="46" stroke="#e0f2fa" stroke-width=".5" stroke-opacity=".6"/>
        <line x1="10" y1="14" x2="38" y2="34" stroke="#e0f2fa" stroke-width=".5" stroke-opacity=".6"/>
        <line x1="38" y1="14" x2="10" y2="34" stroke="#e0f2fa" stroke-width=".5" stroke-opacity=".6"/>
      </svg>
      Consultation des vents de Lileen…
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   TABLES DE CORRESPONDANCE WMO
   ═══════════════════════════════════════════════════════════════ */
const WMO = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌧️',
  61:'🌧️', 63:'🌧️', 65:'🌧️',
  80:'🌦️', 81:'🌧️', 82:'⛈️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};
const WMO_TXT = {
  0:'Ciel dégagé', 1:'Ciel dégagé', 2:'Partiellement nuageux', 3:'Couvert',
  45:'Brouillard', 48:'Brouillard givrant',
  51:'Bruine légère', 53:'Bruine modérée', 55:'Bruine dense',
  61:'Pluie légère', 63:'Pluie modérée', 65:'Pluie forte',
  80:'Averses légères', 81:'Averses', 82:'Averses violentes',
  95:'Orage', 96:'Orage avec grêle', 99:'Orage fort'
};
const WMO_NIGHT = { 0:'🌙', 1:'🌙' };

function pickIcon(code, isNight) {
  if (isNight && WMO_NIGHT[code] !== undefined) return WMO_NIGHT[code];
  return WMO[code] ?? '🌡️';
}

const DAYS_FR = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ═══════════════════════════════════════════════════════════════
   CYCLE JOUR / NUIT
   ═══════════════════════════════════════════════════════════════ */
function getPeriod(sunriseStr, sunsetStr, now) {
  const sunrise = new Date(sunriseStr);
  const sunset  = new Date(sunsetStr);
  const marge   = 30 * 60 * 1000;
  const aubeDebut = new Date(sunrise.getTime() - marge);
  const aubeFin   = new Date(sunrise.getTime() + marge);
  const crepDebut = new Date(sunset.getTime()  - marge);
  const crepFin   = new Date(sunset.getTime()  + marge);
  if (now < aubeDebut) return 'nuit';
  if (now < aubeFin)   return 'aube';
  if (now < crepDebut) return 'jour';
  if (now < crepFin)   return 'crepuscule';
  return 'nuit';
}

function applyTheme(period) {
  document.body.classList.remove('theme-aube','theme-jour','theme-crepuscule','theme-nuit');
  document.body.classList.add('theme-' + period);
}

/* ═══════════════════════════════════════════════════════════════
   GÉNÉRATION SVG
   ═══════════════════════════════════════════════════════════════ */
function gearSVG(size, color='#c8a84b') {
  const teeth = 8, r1 = size*.42, r2 = size*.32, ri = size*.18;
  let d = '';
  for (let i = 0; i < teeth * 2; i++) {
    const a = (Math.PI * i) / teeth;
    const r = i % 2 === 0 ? r1 : r2;
    const x = size/2 + r * Math.cos(a);
    const y = size/2 + r * Math.sin(a);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
  }
  d += 'Z';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">
    <path d="${d}" fill="${color}" fill-opacity=".9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${ri}" fill="#2a1f14" fill-opacity=".6"/>
  </svg>`;
}

function crystalSVG(size=72, icon='🌡️', iconSize=26) {
  return `<svg class="crystal-icon" width="${size}" height="${size}" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="36,3 58,18 58,54 36,69 14,54 14,18" fill="#a8d4e8" fill-opacity=".65" stroke="#c8e8f4" stroke-width="1.2"/>
    <polygon points="36,10 52,22 52,50 36,62 20,50 20,22" fill="#c8e8f4" fill-opacity=".45" stroke="#e0f4fc" stroke-width=".7"/>
    <polygon points="36,18 46,27 46,45 36,54 26,45 26,27" fill="#daf0f8" fill-opacity=".35" stroke="#ffffff" stroke-width=".4"/>
    <line x1="36" y1="3" x2="36" y2="69" stroke="#e8f6fc" stroke-width=".8" stroke-opacity=".7"/>
    <line x1="14" y1="18" x2="58" y2="54" stroke="#e8f6fc" stroke-width=".6" stroke-opacity=".5"/>
    <line x1="58" y1="18" x2="14" y2="54" stroke="#e8f6fc" stroke-width=".6" stroke-opacity=".5"/>
    <text x="36" y="36" text-anchor="middle" dominant-baseline="central" dy="0.05em"
          font-size="${iconSize}" fill="#2a1f14"
          style="font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;">${icon}</text>
  </svg>`;
}

/* ═══════════════════════════════════════════════════════════════
   TEMPÉRATURE RESSENTIE
   ═══════════════════════════════════════════════════════════════ */
function temperatureRessentie(T, V, H) {
  if (T >= 27) {
    const Tf = T * 9/5 + 32;
    const HI =
      -42.379 +
       2.04901523  * Tf +
      10.14333127  * H -
       0.22475541  * Tf * H -
       0.00683783  * Tf * Tf -
       0.05481717  * H  * H  +
       0.00122874  * Tf * Tf * H +
       0.00085282  * Tf * H  * H -
       0.00000199  * Tf * Tf * H * H;
    return (HI - 32) * 5 / 9;
  }
  if (T <= 10 && V > 4.8) {
    return 13.12 + 0.6215*T - 11.37*Math.pow(V,0.16) + 0.3965*T*Math.pow(V,0.16);
  }
  return T - 0.7*Math.sqrt(V) + 0.02*(H - 50);
}

/* ══════════════════════════════════════════════════════════════════
   GHIBLI — génération des éléments animés
   ══════════════════════════════════════════════════════════════════ */

/**
 * Génère le HTML de Calcifer (flamme SVG animée avec yeux).
 * À insérer dans le footer.
 */
function calciferHTML() {

      <!-- Flamme extérieure -->

/**
 * Génère N lucioles en positions aléatoires.
 * Visibles uniquement via body.theme-nuit .firefly { display:block }.
 */
function firefliesHTML(n = 8) {
  return Array.from({length: n}, () => {
    const left = (5  + Math.random() * 88).toFixed(1);
    const top  = (5  + Math.random() * 82).toFixed(1);
    const fx   = ((Math.random() - 0.5) * 34).toFixed(0);
    const fy   = ((Math.random() - 0.5) * 28).toFixed(0);
    const fd   = (4  + Math.random() * 5).toFixed(1);
    const del  = (Math.random() * 7).toFixed(1);
    return `<div class="firefly" style="left:${left}%;top:${top}%;--fx:${fx}px;--fy:${fy}px;--fd:${fd}s;--fdelay:${del}s"></div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════
   ÉTAT PARTAGÉ
   ═══════════════════════════════════════════════════════════════ */
let cachedWeather   = null;  // dernières données valides
let widgetRendered  = false; // true dès le premier render() réussi
let consecutiveErr  = 0;     // compteur d'échecs consécutifs pour le backoff

/* ═══════════════════════════════════════════════════════════════
   RENDER COMPLET (premier chargement + refresh données 30 min)
   Reconstruit l'intégralité du DOM du widget.
   ═══════════════════════════════════════════════════════════════ */
function render(d) {
  const now     = new Date();
  const timeStr = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const period  = getPeriod(d.daily.sunrise[0], d.daily.sunset[0], now);
  applyTheme(period);

  const c      = d.current;
  const isNight = c.is_day === 0;
  const icon   = pickIcon(c.weather_code, isNight);
  const cond   = WMO_TXT[c.weather_code] ?? 'Données indisponibles';
  const temp   = Math.round(c.temperature_2m);
  const hum    = c.relative_humidity_2m;
  const wind   = Math.round(c.wind_speed_10m);

  const ressenti = Math.round(temperatureRessentie(c.temperature_2m, c.wind_speed_10m, c.relative_humidity_2m));
  console.log('Température ressentie :', ressenti, '°C');

  const forecastHTML = d.daily.time.slice(0,5).map((dateStr, i) => {
    const date   = new Date(dateStr + 'T00:00:00');
    const dayName = i === 0 ? 'Auj.' : DAYS_FR[date.getDay()];
    const fi     = WMO[d.daily.weather_code[i]] ?? '🌡️';
    const ft     = Math.round(d.daily.temperature_2m_max[i]);
    const fp     = d.daily.precipitation_probability_max[i] ?? 0;
    return `
      <div class="day">
        <div class="day-name">${dayName}</div>
        <div class="day-icon">${fi}</div>
        <div class="day-temp">${ft}°</div>
        <div class="day-rain">${fp}%</div>
      </div>`;
  }).join('');

  document.getElementById('widget').innerHTML = `
    <div class="header">
      <div class="stars-wrap"><div class="stars"></div></div>

      <svg class="clouds-svg" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
        <g class="cloud-1">
          <g opacity=".18">
            <ellipse cx="320" cy="30" rx="55" ry="18" fill="white"/>
            <ellipse cx="295" cy="35" rx="30" ry="16" fill="white"/>
            <ellipse cx="350" cy="35" rx="28" ry="14" fill="white"/>
          </g>
          <text id="clock-svg" x="320" y="31" text-anchor="middle" dominant-baseline="central"
                font-family="Cinzel, serif" font-size="14" letter-spacing="1.5"
                fill="#f5f0e2" opacity=".55">${timeStr}</text>
        </g>
        <g class="cloud-2" opacity=".13">
          <ellipse cx="60" cy="55" rx="38" ry="13" fill="white"/>
          <ellipse cx="42" cy="59" rx="20" ry="12" fill="white"/>
          <ellipse cx="80" cy="59" rx="22" ry="11" fill="white"/>
        </g>
        <g class="cloud-3" opacity=".1">
          <ellipse cx="200" cy="20" rx="28" ry="9" fill="white"/>
          <ellipse cx="185" cy="24" rx="16" ry="8" fill="white"/>
          <ellipse cx="215" cy="24" rx="15" ry="7" fill="white"/>
        </g>
      </svg>

      <div class="bird-wrap"><div class="bird">🕊️</div></div>

      <div class="location">✦ La météo de Lileen ✦</div>
      <div class="city">La Maison en brique</div>
      <div class="island">La Réunion · Océan Indien</div>

      <div class="main-temp-row">
        <div>
          <span class="temp-big">${temp}<span class="temp-unit">°C</span></span>
          <div class="condition-text">${cond}</div>
          <div id="update-time" class="update-time">⏱ Consulté à ${timeStr}</div>
        </div>
        ${crystalSVG(72, icon, 26)}
      </div>

      <div class="gear-wrap">
        <div class="gear-big">${gearSVG(28, '#c8a84b')}</div>
        <div class="gear-small">${gearSVG(18, '#a08038')}</div>
        <div class="gear-tiny">${gearSVG(12, '#c8a84b')}</div>
      </div>

    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-icon">💧</span>
        <div class="stat-label">Humidité</div>
        <div class="stat-value">${hum}%</div>
      </div>
      <div class="stat">
        <span class="stat-icon">🌬️</span>
        <div class="stat-label">Vent</div>
        <div class="stat-value">${wind}<span style="font-size:10px"> km/h</span></div>
      </div>
      <div class="stat">
        <span class="stat-icon">🌧️</span>
        <div class="stat-label">Pluie J+0</div>
        <div class="stat-value">${d.daily.precipitation_probability_max[0] ?? 0}%</div>
      </div>
    </div>

    <div class="forecast">
      ${firefliesHTML()}
      <div class="forecast-title">Prévisions du Ciel</div>
      <div class="days">${forecastHTML}</div>
    </div>

    <div class="footer">
      ${calciferHTML()}
      <span class="footer-orb" id="footer-orb">✦</span>
      Lileen Weather Bureau · Open-Meteo · toutes les 30 min
      <span class="footer-orb" id="footer-orb2">✦</span>
    </div>
  `;

  widgetRendered = true;
}

/* ═══════════════════════════════════════════════════════════════
   TICK D'HORLOGE — chaque seconde, mise à jour ciblée du DOM
   (pas de re-render, pas de recalcul des données)
   ═══════════════════════════════════════════════════════════════ */
function tickClock() {
  if (!widgetRendered) return;

  const now     = new Date();
  const timeStr = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

  // 1. Horloge dans le nuage SVG
  const clockEl = document.getElementById('clock-svg');
  if (clockEl) clockEl.textContent = timeStr;

  // 2. Ligne "Consulté à …"
  const updateEl = document.getElementById('update-time');
  if (updateEl) updateEl.textContent = '⏱ Consulté à ' + timeStr;
}

/* ═══════════════════════════════════════════════════════════════
   TICK DE CYCLE — chaque minute, réévalue le thème aube/jour/…
   sans rebâtir le DOM (juste la classe CSS sur <body>)
   ═══════════════════════════════════════════════════════════════ */
function tickTheme() {
  if (!cachedWeather) return;
  const period = getPeriod(
    cachedWeather.daily.sunrise[0],
    cachedWeather.daily.sunset[0],
    new Date()
  );
  applyTheme(period);
}

/* ═══════════════════════════════════════════════════════════════
   FETCH AVEC RETRY EXPONENTIEL
   Délais : 30 s → 60 s → 2 min → 4 min → 8 min (plafond 10 min)
   ═══════════════════════════════════════════════════════════════ */
const FETCH_URL =
  'https://api.open-meteo.com/v1/forecast' +
  '?latitude=-20.8873039&longitude=55.4224441' +
  '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,is_day' +
  '&daily=weather_code,temperature_2m_max,precipitation_probability_max,sunrise,sunset' +
  '&timezone=Indian%2FReunion&forecast_days=5&wind_speed_unit=kmh';

const RETRY_DELAYS_MS = [30_000, 60_000, 120_000, 240_000]; // 30 s, 1 min, 2 min, 4 min
const NORMAL_INTERVAL_MS = 30 * 60 * 1000;                  // 30 min

let weatherFetchTimer = null; // référence au prochain setTimeout de fetch

/** Signale visuellement un fetch en cours dans le footer. */
function setFetchingState(active) {
  ['footer-orb', 'footer-orb2'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('fetching', active);
    el.classList.remove('error');
  });
}

/** Signale une erreur persistante dans le footer. */
function setErrorState() {
  ['footer-orb', 'footer-orb2'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('fetching');
    el.classList.add('error');
  });
}

/**
 * Lance un fetch, puis planifie le suivant :
 * - En cas de succès : dans 30 min (NORMAL_INTERVAL_MS), reset du compteur d'erreurs.
 * - En cas d'échec  : retry exponentiel (RETRY_DELAYS_MS), puis 30 min dès le retour réseau.
 *
 * @param {boolean} [silent=false] Si true, n'affiche pas l'état "fetching" (utilisé pour le 1er chargement).
 */
async function scheduledFetch(silent = false) {
  if (!silent) setFetchingState(true);

  try {
    const r = await fetch(FETCH_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    cachedWeather    = data;
    consecutiveErr   = 0;
    setFetchingState(false);
    render(data);

    // Prochain fetch dans 30 min
    clearTimeout(weatherFetchTimer);
    weatherFetchTimer = setTimeout(() => scheduledFetch(), NORMAL_INTERVAL_MS);

  } catch (e) {
    console.warn('Lileen Weather — fetch échoué :', e.message);
    setFetchingState(false);

    if (!widgetRendered) {
      // Premier chargement en échec : affiche un message d'erreur
      document.getElementById('widget').innerHTML =
        `<div class="error-msg">✦ Les vents sont introuvables.<br>
         <small style="font-size:10px">${e.message}</small><br>
         <small style="font-size:10px;opacity:.6">Nouvelle tentative dans quelques secondes…</small></div>`;
    } else {
      // Le widget est déjà affiché : on signale l'erreur discrètement
      setErrorState();
    }

    // Retry avec délai exponentiel
    const delay = RETRY_DELAYS_MS[Math.min(consecutiveErr, RETRY_DELAYS_MS.length - 1)];
    consecutiveErr++;
    console.log('Retry dans', delay / 1000, 's (tentative', consecutiveErr, ')');
    clearTimeout(weatherFetchTimer);
    weatherFetchTimer = setTimeout(() => scheduledFetch(), delay);
  }
}

/* ═══════════════════════════════════════════════════════════════
   DÉMARRAGE
   ═══════════════════════════════════════════════════════════════ */
// Tick d'horloge : toutes les secondes, mise à jour ciblée uniquement
setInterval(tickClock, 1_000);

// Tick de thème : chaque minute, réévalue le cycle sans toucher au DOM de données
setInterval(tickTheme, 60_000);

// Premier fetch (immédiat)
scheduledFetch(true);
</script>
</body>
</html>
